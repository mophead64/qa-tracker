# QA Tracker on Azure Container Apps: Microsoft Entra ID sign-in + attachments in Blob Storage +
# Application Insights. Register the Entra app first (docs/sso.md) with the redirect URI
# https://<the app's FQDN>/signin-oidc, and put its client secret in Key Vault as oidc-client-secret.
# Used by `az containerapp create --yaml` — see docs/deployment-examples.md#azure for the steps that
# create everything referenced here. Replace each <placeholder> first (the guide's sed one-liner
# does it). Secrets stay in Key Vault and are read with the user-assigned managed identity.
location: <location>
identity:
  type: UserAssigned
  userAssignedIdentities:
    <identity-id>: {}
properties:
  managedEnvironmentId: <environment-id>
  configuration:
    activeRevisionsMode: Single
    ingress:
      external: true
      targetPort: 8080
      transport: auto
      allowInsecure: false
    secrets:
      - name: db-password
        keyVaultUrl: https://<key-vault>.vault.azure.net/secrets/db-password
        identity: <identity-id>
      - name: storage-connection
        keyVaultUrl: https://<key-vault>.vault.azure.net/secrets/storage-connection
        identity: <identity-id>
      - name: oidc-client-secret
        keyVaultUrl: https://<key-vault>.vault.azure.net/secrets/oidc-client-secret
        identity: <identity-id>
      - name: appinsights-connection
        keyVaultUrl: https://<key-vault>.vault.azure.net/secrets/appinsights-connection
        identity: <identity-id>
  template:
    containers:
      - name: qatracker
        image: ghcr.io/mophead64/qa-tracker:latest
        resources:
          cpu: 0.5
          memory: 1Gi
        env:
          - name: QATRACKER_DB_HOST
            value: <postgres-server>.postgres.database.azure.com
          - name: QATRACKER_DB_USER
            value: qatracker
          - name: QATRACKER_DB_PASSWORD
            secretRef: db-password
          - name: QATRACKER_STORAGE_PROVIDER
            value: Azure
          - name: QATRACKER_AZURE_STORAGE_CONNECTION_STRING
            secretRef: storage-connection
          - name: QATRACKER_AUTH_PROVIDER
            value: Entra
          - name: QATRACKER_OIDC_TENANT_ID
            value: <tenant-id>
          - name: QATRACKER_OIDC_CLIENT_ID
            value: <client-id>
          - name: QATRACKER_OIDC_CLIENT_SECRET
            secretRef: oidc-client-secret
          # SSO only: no local passwords (the QA role comes from Entra app roles).
          - name: QATRACKER_LOCAL_AUTH_ENABLED
            value: "false"
          - name: QATRACKER_TELEMETRY_PROVIDER
            value: AzureMonitor
          - name: QATRACKER_AZURE_MONITOR_CONNECTION_STRING
            secretRef: appinsights-connection
          # TLS ends at the Container Apps ingress.
          - name: QATRACKER_FORWARDED_HEADERS
            value: "true"
        probes:
          - type: Startup
            httpGet:
              path: /health/live
              port: 8080
            periodSeconds: 5
            failureThreshold: 24
          - type: Liveness
            httpGet:
              path: /health/live
              port: 8080
          - type: Readiness
            httpGet:
              path: /health/ready
              port: 8080
    scale:
      minReplicas: 1
      maxReplicas: 3
