name: CI

# build (restore -> build -> unit tests -> build & save the Docker image) ->
# e2e (stand up Postgres + Garage + the app, run the Playwright suite against it) ->
# publish (push the tested image to GHCR) ->
# release (on master only: cut a GitHub release with detailed notes for the pushed tag)

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write        # "Create GitHub release" job (creates the tag + release on master)
  packages: write         # push the image to GitHub Container Registry (ghcr.io)
  pull-requests: read     # expand squash-merged PRs into their original commits for release notes

env:
  DOTNET_VERSION: '10.0.x'
  NODE_VERSION: '22'
  # Published image, e.g. ghcr.io/mophead64/qa-tracker. Pushed with the built-in
  # GITHUB_TOKEN — no registry secret to manage.
  REGISTRY_IMAGE: ghcr.io/${{ github.repository }}
  DOTNET_NOLOGO: 'true'
  DOTNET_CLI_TELEMETRY_OPTOUT: 'true'
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 'true'
  # Credentials used only for the throwaway CI database + seeded admin account.
  CI_ADMIN_EMAIL: e2e@qatracker.local
  CI_ADMIN_PASSWORD: 'E2eP@ssw0rd!'

jobs:
  # ---- restore / build / unit tests / build the image under test -----------
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      version: ${{ steps.build_meta.outputs.version }}
      branch: ${{ steps.build_meta.outputs.branch }}
      commit: ${{ steps.build_meta.outputs.commit }}
      commit_short: ${{ steps.build_meta.outputs.commit_short }}
      build_date: ${{ steps.build_meta.outputs.build_date }}
      is_release: ${{ steps.build_meta.outputs.is_release }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: src/QaTracker.Web/package-lock.json

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', '**/*.slnx') }}
          restore-keys: ${{ runner.os }}-nuget-

      - name: Restore
        run: dotnet restore QaTracker.slnx

      - name: Build
        run: dotnet build QaTracker.slnx --no-restore -c Release

      - name: Unit tests
        run: >
          dotnet test tests/QaTracker.UnitTests/QaTracker.UnitTests.csproj
          --no-build -c Release
          --logger "trx;LogFileName=unit.trx"
          --results-directory TestResults

      - name: Upload unit test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results
          path: TestResults/
          if-no-files-found: ignore

      # Version scheme: git tag (minus leading "v") on a tag build; otherwise CalVer
      # YYYY.MM.DD, with a ".N" suffix when today already has releases. Branch + short SHA
      # are shown alongside in the app regardless. is_release is true only on a master push.
      - name: Compute build metadata
        id: build_meta
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          set -euo pipefail
          branch="$BRANCH"
          commit='${{ github.sha }}'
          commit_short="${commit:0:7}"
          build_date="$(date -u +%Y-%m-%dT%H:%M:%SZ)"

          if [ '${{ github.ref_type }}' = 'tag' ]; then
            version="${GITHUB_REF_NAME#v}"
            is_release=false
          else
            base="$(date -u +%Y.%m.%d)"
            # git/matching-refs returns a (possibly empty) array of every tag starting v<base>,
            # so its length is how many releases today already has.
            existing="$(gh api "repos/${{ github.repository }}/git/matching-refs/tags/v${base}" \
              --jq 'length' 2>/dev/null || true)"
            existing="${existing:-0}"
            if [ "$existing" -eq 0 ]; then version="$base"; else version="${base}.${existing}"; fi
            if [ '${{ github.event_name }}' = 'push' ] && [ '${{ github.ref }}' = 'refs/heads/master' ]; then
              is_release=true
            else
              is_release=false
            fi
          fi

          {
            echo "branch=$branch"
            echo "commit=$commit"
            echo "commit_short=$commit_short"
            echo "build_date=$build_date"
            echo "version=$version"
            echo "is_release=$is_release"
          } >> "$GITHUB_OUTPUT"
          echo "Build $version ($branch:$commit_short) is_release=$is_release"

      - uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true                # keep it in the local daemon so it can be saved below
          tags: qatracker:ci
          build-args: |
            APP_VERSION=${{ steps.build_meta.outputs.version }}
            GIT_BRANCH=${{ steps.build_meta.outputs.branch }}
            GIT_COMMIT=${{ steps.build_meta.outputs.commit }}
            GIT_COMMIT_SHORT=${{ steps.build_meta.outputs.commit_short }}
            BUILD_DATE=${{ steps.build_meta.outputs.build_date }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Hand the exact built image and the test-project build output to the later
      # jobs, which run on fresh runners, so nothing gets rebuilt from source.
      - name: Save Docker image
        run: docker save qatracker:ci -o qatracker-image.tar

      - uses: actions/upload-artifact@v4
        with:
          name: docker-image
          path: qatracker-image.tar
          retention-days: 1
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: e2e-build-output
          path: tests/QaTracker.E2ETests/bin/Release/**
          retention-days: 1
          if-no-files-found: error

  # ---- stand up Postgres + Garage + the built image, run the E2E suite -----
  e2e:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: docker-image

      - name: Load Docker image
        run: docker load -i qatracker-image.tar

      - uses: actions/download-artifact@v4
        with:
          name: e2e-build-output
          path: tests/QaTracker.E2ETests/bin/Release

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Start Postgres, Garage and the app
        run: |
          set -euo pipefail
          docker network create qanet

          docker run -d --name db --network qanet \
            -e POSTGRES_DB=qatracker \
            -e POSTGRES_USER=qatracker \
            -e POSTGRES_PASSWORD=qatracker \
            --health-cmd 'pg_isready -U qatracker -d qatracker' \
            --health-interval 5s --health-timeout 5s --health-retries 20 \
            postgres:17-alpine

          # --single-node --default-bucket makes Garage bootstrap its own layout, access key
          # and bucket on first boot — no separate `mc mb`-style init container needed
          # (unlike MinIO, which is also no longer reliably pullable from Docker Hub).
          docker run -d --name garage --network qanet \
            -v "$(pwd)/deploy/garage/garage.toml:/etc/garage.toml:ro" \
            -e GARAGE_RPC_SECRET=5b066687bbd5cbf03e78d89fe62fab6034272dbd5888f88ff52d6e894e862e67 \
            -e GARAGE_DEFAULT_ACCESS_KEY=qatracker-dev \
            -e GARAGE_DEFAULT_SECRET_KEY=qatracker-dev-secret-key \
            -e GARAGE_DEFAULT_BUCKET=qatracker-attachments \
            dxflrs/garage:v2.4.1 /garage server --single-node --default-bucket

          echo "Waiting for Postgres..."
          for _ in $(seq 1 30); do
            [ "$(docker inspect -f '{{.State.Health.Status}}' db)" = healthy ] && break
            sleep 2
          done

          echo "Waiting for Garage..."
          for _ in $(seq 1 20); do
            docker exec garage /garage health >/dev/null 2>&1 && break
            sleep 2
          done

          docker run -d --name app --network qanet -p 8080:8080 \
            -e ASPNETCORE_ENVIRONMENT=Production \
            -e QATRACKER_DB_HOST=db \
            -e QATRACKER_DB_NAME=qatracker \
            -e QATRACKER_DB_USER=qatracker \
            -e QATRACKER_DB_PASSWORD=qatracker \
            -e QATRACKER_ADMIN_EMAIL="$CI_ADMIN_EMAIL" \
            -e QATRACKER_ADMIN_PASSWORD="$CI_ADMIN_PASSWORD" \
            -e QATRACKER_AUTH_PROVIDER= \
            -e QATRACKER_TELEMETRY_PROVIDER= \
            -e QATRACKER_STORAGE_PROVIDER=S3 \
            -e QATRACKER_S3_BUCKET=qatracker-attachments \
            -e QATRACKER_S3_REGION=us-east-1 \
            -e QATRACKER_S3_ENDPOINT=http://garage:3900 \
            -e QATRACKER_S3_ACCESS_KEY=qatracker-dev \
            -e QATRACKER_S3_SECRET_KEY=qatracker-dev-secret-key \
            -e QATRACKER_S3_FORCE_PATH_STYLE=true \
            qatracker:ci

      - name: Wait for the app to be ready
        run: |
          for _ in $(seq 1 45); do
            if curl -fsS http://localhost:8080/health/ready >/dev/null; then
              echo "app is ready"; exit 0
            fi
            sleep 2
          done
          echo "::error::app did not become ready in time"
          docker logs app
          exit 1

      - name: Install Playwright browsers
        run: pwsh tests/QaTracker.E2ETests/bin/Release/net10.0/playwright.ps1 install --with-deps chromium

      - name: E2E tests
        env:
          QATRACKER_E2E_BASEURL: http://localhost:8080
          QATRACKER_E2E_EMAIL: ${{ env.CI_ADMIN_EMAIL }}
          QATRACKER_E2E_PASSWORD: ${{ env.CI_ADMIN_PASSWORD }}
        run: >
          dotnet test tests/QaTracker.E2ETests/QaTracker.E2ETests.csproj
          --no-build -c Release
          --logger "trx;LogFileName=e2e.trx"
          --results-directory TestResults

      - name: App logs
        if: always()
        run: docker logs app || true

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-test-results
          path: TestResults/
          if-no-files-found: ignore

  # ---- publish the exact image that just passed the E2E suite --------------
  publish:
    needs: [build, e2e]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: docker-image

      - name: Load Docker image
        run: docker load -i qatracker-image.tar

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY_IMAGE }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/master' }}
            type=raw,value=${{ needs.build.outputs.version }},enable=${{ github.ref == 'refs/heads/master' }}
            type=sha,format=short
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag and push
        run: |
          set -euo pipefail
          while read -r tag; do
            [ -z "$tag" ] && continue
            echo "Pushing $tag"
            docker tag qatracker:ci "$tag"
            docker push "$tag"
          done <<< "${{ steps.meta.outputs.tags }}"

  # ---- cut a GitHub release so running instances can see an update is available ----
  # Only on a master push. Release notes expand each squash-merged PR into its
  # original commits (see .github/scripts/generate-release-notes.sh) instead of
  # collapsing a whole PR into a single bullet.
  release:
    needs: [build, publish]
    if: needs.build.outputs.is_release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Find previous release tag
        id: prev
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          prev_tag="$(gh release list --limit 1 --json tagName --jq '.[0].tagName' 2>/dev/null || true)"
          echo "tag=$prev_tag" >> "$GITHUB_OUTPUT"

      - name: Generate release notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          .github/scripts/generate-release-notes.sh \
            "${{ github.repository }}" \
            "${{ steps.prev.outputs.tag }}" \
            "${{ needs.build.outputs.commit }}" \
            "${{ env.REGISTRY_IMAGE }}" \
            "${{ needs.build.outputs.version }}" \
            > release-notes.md

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.build.outputs.version }}
          name: v${{ needs.build.outputs.version }}
          target_commitish: ${{ needs.build.outputs.commit }}
          body_path: release-notes.md
