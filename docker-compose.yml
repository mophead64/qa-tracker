# Local development / on-prem stack.
#   docker compose up            -> database + app
#   docker compose up db         -> just PostgreSQL (run the app with `dotnet run`)
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${QATRACKER_DB_NAME:-qatracker}
      POSTGRES_USER: ${QATRACKER_DB_USER:-qatracker}
      POSTGRES_PASSWORD: ${QATRACKER_DB_PASSWORD:-qatracker}
    ports:
      - "${QATRACKER_DB_PORT:-5432}:5432"
    volumes:
      - qatracker-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${QATRACKER_DB_USER:-qatracker} -d ${QATRACKER_DB_NAME:-qatracker}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # S3-compatible object storage for attachments (project resources, test-case resources,
  # defect evidence). Swap for real AWS S3 / Azure Blob in hosted environments by changing
  # the web service's QATRACKER_STORAGE_* env vars — see .env.example.
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${QATRACKER_S3_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${QATRACKER_S3_SECRET_KEY:-minioadmin}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - qatracker-minio:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${QATRACKER_S3_ACCESS_KEY:-minioadmin} ${QATRACKER_S3_SECRET_KEY:-minioadmin} &&
      mc mb --ignore-existing local/${QATRACKER_S3_BUCKET:-qatracker-attachments}
      "

  web:
    build:
      context: .
    depends_on:
      db:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      QATRACKER_DB_HOST: db
      QATRACKER_DB_PORT: "5432"
      QATRACKER_DB_NAME: ${QATRACKER_DB_NAME:-qatracker}
      QATRACKER_DB_USER: ${QATRACKER_DB_USER:-qatracker}
      QATRACKER_DB_PASSWORD: ${QATRACKER_DB_PASSWORD:-qatracker}
      QATRACKER_ADMIN_EMAIL: ${QATRACKER_ADMIN_EMAIL:-}
      QATRACKER_ADMIN_PASSWORD: ${QATRACKER_ADMIN_PASSWORD:-}
      QATRACKER_STORAGE_PROVIDER: ${QATRACKER_STORAGE_PROVIDER:-S3}
      QATRACKER_S3_BUCKET: ${QATRACKER_S3_BUCKET:-qatracker-attachments}
      QATRACKER_S3_REGION: ${QATRACKER_S3_REGION:-us-east-1}
      QATRACKER_S3_ENDPOINT: http://minio:9000
      QATRACKER_S3_ACCESS_KEY: ${QATRACKER_S3_ACCESS_KEY:-minioadmin}
      QATRACKER_S3_SECRET_KEY: ${QATRACKER_S3_SECRET_KEY:-minioadmin}
      QATRACKER_S3_FORCE_PATH_STYLE: "true"
    ports:
      - "8080:8080"

volumes:
  qatracker-db:
  qatracker-minio:
